          AFTER="${{ steps.ram_after.outputs.ram_after }}"
          TOTAL=$(sysctl -n hw.memsize | awk '{printf "%.1f", $1/1073741824}')
          {
            echo "## 📊 Speculative Eval — Memory Readings"
