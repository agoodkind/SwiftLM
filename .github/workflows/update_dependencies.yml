name: Dependency Automation

# Prepare a bump branch for a person to review and open as a pull request.
on:
  repository_dispatch:
    types: [dependency_bump]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  bump-dependencies:
    runs-on: ubuntu-24.04
    container: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    timeout-minutes: 60
    steps:
      - name: Refresh Ubuntu package metadata
        run: apt-get update

      - name: Install portable build prerequisites
        run: apt-get install --yes --no-install-recommends make curl

      - name: Checkout the candidate repository
        uses: actions/checkout@v4
        with:
          path: candidate
          submodules: recursive
          fetch-depth: 0

      - name: Verify the fixed Swift dependency bump command
        id: maintenance
        uses: agoodkind/lmd/.github/actions/setup-maintenance@763487338b00335c1dc9fb65d974d8d547519f85
        with:
          ref: '763487338b00335c1dc9fb65d974d8d547519f85'
          test-filter: DependencyBumpTests

      - name: Prepare a dependency branch for manual review
        id: bump
        env:
          MAINTENANCE_BIN: ${{ steps.maintenance.outputs.binary }}
          PAYLOAD_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          PAYLOAD_NEW_TAG: ${{ github.event.client_payload.new_tag }}
        run: '"$MAINTENANCE_BIN" bump-dependency "$GITHUB_WORKSPACE/candidate"'
